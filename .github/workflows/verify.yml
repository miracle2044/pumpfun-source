# Fork-only, explicitly dispatched environment qualification.
name: Pump fixed-toolchain environment qualification
run-name: Pump macOS ARM64 qualification
on:
  workflow_dispatch:
    inputs:
      base:
        description: Full base source commit in this fork
        required: true
        default: 1e04f5b34aa33c53f2b20b4200ba4ba266b4203e
      candidate:
        description: Full candidate source commit in this fork
        required: true
        default: 1e04f5b34aa33c53f2b20b4200ba4ba266b4203e
permissions:
  contents: read
concurrency:
  group: pump-environment-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'miracle2044/pumpfun-source'
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '2'
      PUMP_BUILD_SLOTS: '1'
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - name: Validate source revisions and host architecture
        env:
          BASE: ${{ inputs.base }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          test "$(uname -m)" = arm64
          sw_vers
          uname -m
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: tooling
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            reconstruction/harness
            reconstruction/base
            reconstruction/toolchain
            reconstruction/pump-main/baseline
            evidence/original/pump
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.base }}
          path: baseline
          persist-credentials: false
          filter: blob:none
          sparse-checkout: programs/pump
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          persist-credentials: false
          filter: blob:none
          sparse-checkout: programs/pump
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check comparison gates
        run: |
          python -B tooling/reconstruction/harness/test_compare_scores.py
          python -B tooling/reconstruction/harness/test_build_score_pair.py
      - name: Install and authenticate the exact v1.44 SDK
        run: |
          curl --fail --location --retry 3 https://github.com/anza-xyz/platform-tools/releases/download/v1.44/platform-tools-osx-aarch64.tar.bz2 -o "$RUNNER_TEMP/sdk.tar.bz2"
          echo "66e20d135fddd70ff519baf7ff320d762957f9aedf93a50e23756db23ad79351  $RUNNER_TEMP/sdk.tar.bz2" | shasum -a 256 -c -
          mkdir -p "$HOME/.cache/solana/v1.44/platform-tools"
          tar -xjf "$RUNNER_TEMP/sdk.tar.bz2" -C "$HOME/.cache/solana/v1.44/platform-tools"
          python -B tooling/reconstruction/toolchain/bootstrap.py --sdk-check full
          "$HOME/.cache/pumpfun-reconstruction/toolchains/hybrid144/rust/bin/rustc" -vV
      - name: Fetch source-locked dependencies using the pinned SDK Cargo
        run: |
          export RUSTC="$HOME/.cache/pumpfun-reconstruction/toolchains/hybrid144/rust/bin/rustc"
          export CARGO_HOME="$HOME/.cargo"
          export CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse
          # Acquire the whole locked closure before the harness stages a new
          # virtual workspace. Target-filtered fetch omitted build-needed crates.
          "$HOME/.cache/solana/v1.44/platform-tools/rust/bin/cargo" fetch --locked --manifest-path baseline/programs/pump/Cargo.toml
          "$HOME/.cache/solana/v1.44/platform-tools/rust/bin/cargo" fetch --locked --manifest-path candidate/programs/pump/Cargo.toml
          python - <<'PY'
          import hashlib, pathlib, tomllib
          cache = pathlib.Path.home() / '.cargo/registry/cache'
          for source in ('baseline', 'candidate'):
              packages = tomllib.loads(pathlib.Path(source, 'programs/pump/Cargo.lock').read_text())['package']
              count = 0
              for package in packages:
                  if not package.get('source', '').startswith('registry+'):
                      continue
                  archives = cache.glob('*/' + package['name'] + '-' + package['version'] + '.crate')
                  if not any(hashlib.sha256(path.read_bytes()).hexdigest() == package['checksum'] for path in archives):
                      raise SystemExit('missing or changed locked crate: ' + package['name'])
                  count += 1
              print(source, count, 'locked crate archives verified')
          PY
      - name: Compile two fresh source trees and compare every window
        run: >-
          python -B tooling/reconstruction/harness/build_score_pair.py
          --base baseline --candidate candidate --out "$RUNNER_TEMP/pump-score-pair"
      - name: Retain receipts and compiler diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pump-environment-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: |
            ${{ runner.temp }}/pump-score-pair/receipt.json
            ${{ runner.temp }}/pump-score-pair/*-score.json
            ${{ runner.temp }}/pump-score-pair/base/build.log
            ${{ runner.temp }}/pump-score-pair/candidate/build.log
          if-no-files-found: warn
